services:
  backend:
    build:
      context: ./Testes-unitarios-Tratamento-de-erros
    container_name: sprint8-backend
    ports:
      - "3000:3000"
    env_file:
      - ./Testes-unitarios-Tratamento-de-erros/.env

  frontend:
    build:
      context: ./frontend
    container_name: sprint8-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend